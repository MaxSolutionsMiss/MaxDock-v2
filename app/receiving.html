<body>
  <div id="app-root" class="login-page" aria-live="polite"></div>
  <noscript><main class="login-page"><section class="login-card"><h1 class="login-card__title">JavaScript is required</h1><p class="login-card__sub">MaxDock needs JavaScript to load this screen.</p></section></main></noscript>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.52.1/dist/umd/supabase.min.js"></script>
  <script type="module" src="../js/pages/receiving.js"></script>
  <script type="module">
    // Registered only where the browser has one. It caches the shell so the icon opens
    // instantly on a dock's wifi; it never caches anything about a load.
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
      // An installed app resumes rather than reloads. Tapping the icon after a deploy brings
      // back the copy that was already running, so somebody can be looking at last week's
      // build and have no way to tell. A new worker takes over as soon as it activates, and
      // that is the moment to pick the new one up.
      //
      // Guarded on there having been a controller already: on the very first visit the worker
      // claims the page and this would fire once for no reason.
      let controlled = Boolean(navigator.serviceWorker.controller);
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (controlled) location.reload();
        controlled = true;
      });
    }
  </script>
</body>
</html>
