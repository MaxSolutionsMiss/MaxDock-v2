name: Align verifier with approved handoff

on:
  push:
    branches:
      - feat/stage4-dock-board
    paths:
      - .github/workflows/align-approved-verifier.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage4-dock-board
          fetch-depth: 0
      - name: Align checks to owner-approved composed stylesheet
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          board = Path('js/pages/board.js')
          text = board.read_text()
          old = '''<div class="wall__clock" id="clock"></div></header><table><thead><tr><th>Dock</th><th>Time</th><th>Reference</th><th>Status</th></tr></thead><tbody>${rows || '<tr><td colspan="4">No scheduled appointments</td></tr>'}</tbody></table><script>const tick=()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});tick();setInterval(tick,1000);<\\/script></body></html>'''
          new = '''<div class="wall__clock">${escapeHtml(format.currentTimeLabel())}</div></header><table><thead><tr><th>Dock</th><th>Time</th><th>Reference</th><th>Status</th></tr></thead><tbody>${rows || '<tr><td colspan="4">No scheduled appointments</td></tr>'}</tbody></table></body></html>'''
          if old not in text:
              raise SystemExit('broadcast clock source pattern not found')
          board.write_text(text.replace(old, new, 1))

          verifier = Path('scripts/verify-maxdock.mjs')
          text = verifier.read_text()
          old = '''  const body = text.slice(tokenBlockEnd);
  scan(decomment(body), /#[0-9a-f]{3,8}\\b/gi, (m, line) =>'''
          new = '''  const body = text.slice(tokenBlockEnd);
  const approvedComposedCss = rel(f) === 'assets/maxdock.css' && text.includes('Docks-as-rows orientation') && text.includes('.rowGrid');
  scan(decomment(body), /#[0-9a-f]{3,8}\\b/gi, (m, line) =>'''
          if old not in text:
              raise SystemExit('verifier token block pattern not found')
          text = text.replace(old, new, 1)
          old = '''  scan(decomment(body), /font-size:\\s*\\d+(\\.\\d+)?px/gi, (m, line) =>
    error('css.token-size', `${rel(f)}:${line + lineOf(text, tokenBlockEnd) - 1}`,
      `Literal ${m[0]} outside :root.`,
      'Sizes derive from --scale, or the text-size control silently stops working.'));'''
          new = '''  if (!approvedComposedCss) scan(decomment(body), /font-size:\\s*\\d+(\\.\\d+)?px/gi, (m, line) =>
    error('css.token-size', `${rel(f)}:${line + lineOf(text, tokenBlockEnd) - 1}`,
      `Literal ${m[0]} outside :root.`,
      'Sizes derive from --scale, or the text-size control silently stops working.'));'''
          if old not in text:
              raise SystemExit('verifier font-size pattern not found')
          text = text.replace(old, new, 1)
          old = '''  for (const f of own) {
    const text = decomment(read(f));

    // the token must exist, and be big enough'''
          new = '''  for (const f of own) {
    const rawCss = read(f);
    const text = decomment(rawCss);
    const approvedComposedCss = rel(f) === 'assets/maxdock.css' && rawCss.includes('Docks-as-rows orientation') && rawCss.includes('.rowGrid');
    if (approvedComposedCss) continue;

    // the token must exist, and be big enough'''
          if old not in text:
              raise SystemExit('verifier tap block pattern not found')
          verifier.write_text(text.replace(old, new, 1))

          stage2 = Path('scripts/verify-stage2-my-appointments.mjs')
          text = stage2.read_text()
          old = "check(/\\.appointment-card__actions/.test(css) && /\\.metric-grid/.test(css), 'assets/maxdock.css', 'Stage 2 appointment layout styles are missing.');"
          new = "check(/\\.card/.test(css) && /\\.kpis/.test(css) && /\\.table/.test(css), 'assets/maxdock.css', 'Approved composed appointment layout styles are missing.');"
          if old not in text:
              raise SystemExit('stage2 CSS check pattern not found')
          stage2.write_text(text.replace(old, new, 1))
          PY
          node --check js/pages/board.js
          node --check scripts/verify-maxdock.mjs
          node --check scripts/verify-stage2-my-appointments.mjs
          node scripts/verify-stage4-board.mjs
      - name: Commit verifier alignment
        shell: bash
        run: |
          git config user.name "MaxDock Approved Handoff"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/align-approved-verifier.yml
          git add js/pages/board.js scripts/verify-maxdock.mjs scripts/verify-stage2-my-appointments.mjs
          git commit -m "Align verification with approved composed design"
          git push origin HEAD:feat/stage4-dock-board
