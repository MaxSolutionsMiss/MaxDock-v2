name: Clean Stage 4 Dock Board build

on:
  push:
    branches: [feat/stage4-dock-board]
    paths: [.github/workflows/build-stage4-clean.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage4-dock-board
          fetch-depth: 0
      - name: Generate source only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/build-stage4.yml').read_text().splitlines()
          start = next(i + 1 for i, line in enumerate(lines) if line.strip() == 'run: |')
          script = []
          for line in lines[start:]:
              if line.startswith('          '): script.append(line[10:])
              elif not line.strip(): script.append('')
              else: break
          text = '\n'.join(script) + '\n'
          text = text.split('rm .github/workflows/build-stage4.yml', 1)[0]
          Path('/tmp/generate-stage4.sh').write_text(text)
          PY
          bash /tmp/generate-stage4.sh
          node --check js/pages/board.js
          node scripts/verify-stage4-board.mjs
      - name: Commit generated source
        shell: bash
        run: |
          rm .github/workflows/build-stage4.yml .github/workflows/build-stage4-retry.yml .github/workflows/build-stage4-final.yml .github/workflows/build-stage4-clean.yml
          git config user.name "MaxDock Stage Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Build Stage 4 operational Dock Board"
          git push origin HEAD:feat/stage4-dock-board
