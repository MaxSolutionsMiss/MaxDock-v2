name: Move composed helper
on:
  push:
    branches: [feat/stage4-dock-board]
    paths: [.github/workflows/move-composed-helper.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage4-dock-board
      - name: Move shared helper
        run: |
          git mv js/pages/composed.js js/ui/composed.js
          for file in js/pages/queue.js js/pages/settings.js js/pages/reports.js js/pages/users.js js/pages/data.js; do
            sed -i "s#'./composed.js'#'../ui/composed.js'#" "$file"
          done
      - name: Commit
        run: |
          git config user.name 'MaxDock Stage Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add js/ui/composed.js js/pages/queue.js js/pages/settings.js js/pages/reports.js js/pages/users.js js/pages/data.js
          git commit -m 'Move composed page helper into shared UI'
          git push
