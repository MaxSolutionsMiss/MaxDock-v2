name: Apply design discipline pass v3

on:
  push:
    branches: [feat/stage3-booking]
    paths: [.github/workflows/apply-design-discipline-v3.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage3-booking
          fetch-depth: 0
      - name: Extract prepared transformations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-design-discipline-v2.yml').read_text()
          parts = source.split("python <<'PY'\n")[1:]
          if len(parts) != 2:
              raise SystemExit('Expected two prepared transformation blocks')
          for index, part in enumerate(parts, 1):
              code = part.split('\n          PY', 1)[0]
              code = '\n'.join(line[10:] if line.startswith('          ') else line for line in code.splitlines())
              Path(f'/tmp/design-pass-{index}.py').write_text(code)
          PY
          python -m py_compile /tmp/design-pass-1.py /tmp/design-pass-2.py
      - name: Commit authoritative design reference
        shell: bash
        run: |
          python /tmp/design-pass-1.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/maxdock-design-v2.html docs/DESIGN_CORRECTIONS.md
          git commit -m "docs: refresh authoritative MaxDock design reference"
      - name: Apply and verify shared application discipline
        shell: bash
        run: |
          python /tmp/design-pass-2.py
          node scripts/verify-maxdock.mjs
          git add assets/maxdock.css index.html js/pages/login.js js/pages/booking.js
          git rm .github/workflows/apply-design-discipline.yml .github/workflows/apply-design-discipline-v2.yml .github/workflows/apply-design-discipline-v3.yml
          git commit -m "style: apply shared field and login discipline"
          git push origin HEAD:feat/stage3-booking