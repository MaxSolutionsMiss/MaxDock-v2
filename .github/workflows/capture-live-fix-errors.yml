name: Capture live fix verifier errors
on:
  push:
    paths:
      - .github/workflows/capture-live-fix-errors.yml
permissions:
  contents: write
jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          {
            echo '=== verify-maxdock ==='
            node scripts/verify-maxdock.mjs
            echo '=== implementation ==='
            node scripts/verify-maxdock-implementation.mjs
            echo '=== stage1 ==='
            node scripts/verify-stage1-shell.mjs
            echo '=== stage2 ==='
            node scripts/verify-stage2-my-appointments.mjs
            echo '=== stage3 ==='
            node scripts/verify-stage3-booking.mjs
            echo '=== stage4 ==='
            node scripts/verify-stage4-board.mjs
          } > .live-fix-errors.txt 2>&1
      - run: |
          git config user.name 'MaxDock Diagnostics'
          git config user.email 'actions@users.noreply.github.com'
          git add .live-fix-errors.txt
          git commit -m 'Capture live fix verifier diagnostics'
          git push
