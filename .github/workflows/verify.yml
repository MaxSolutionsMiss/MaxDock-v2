name: Verify MaxDock Conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read implementation stage
        id: stage
        shell: bash
        run: |
          stage=$(awk '/^## Stage/{getline; while ($0 ~ /^[[:space:]]*$/) getline; print $1; exit}' docs/STATUS.md)
          if [[ ! "$stage" =~ ^[0-8]$ ]]; then
            echo "Could not read a valid stage number from docs/STATUS.md"
            exit 1
          fi
          echo "number=$stage" >> "$GITHUB_OUTPUT"
          echo "MaxDock implementation stage: $stage"

      - name: Stage 0 bypass is void once Stage 1 work exists
        shell: bash
        run: |
          if [[ "${{ steps.stage.outputs.number }}" == "0" ]] \
             && { [[ -d js ]] || [[ -d app ]] || [[ -f assets/maxdock.css ]]; }; then
            echo "Stage 1 directories exist but STATUS.md still says Stage 0."
            echo "Update docs/STATUS.md — the conformance bypass no longer applies."
            exit 1
          fi

      - name: Every shipped module must parse
        run: node scripts/verify-modules.mjs

      - name: Date arithmetic
        run: node scripts/verify-format.mjs

      - name: Run Claude architecture checker
        shell: bash
        run: |
          set +e
          node scripts/verify-maxdock.mjs
          result=$?
          set -e

          if [[ "$result" -ne 0 && "${{ steps.stage.outputs.number }}" == "0" ]]; then
            echo "::warning title=Stage 0 legacy baseline::Claude's checker found violations in the temporary React/Vite shell. They are recorded but do not block the contract-only Stage 0. From Stage 1 onward, the same findings fail CI."
            exit 0
          fi

          exit "$result"

      - name: Run implementation architecture gate
        run: node scripts/verify-maxdock-implementation.mjs

      - name: Test both verifiers against clean and bad fixtures
        run: node scripts/test-verifiers.mjs

      - name: Bulk user import
        run: node scripts/verify-users-import.mjs

      - name: Verify bulk appointment import
        run: node scripts/verify-appointments-import.mjs

      - name: Verify per-role rail visibility
        run: node scripts/verify-role-visibility.mjs

      - name: Which truck a combined run needs
        run: node scripts/verify-truck-ladder.mjs

      - name: Documents on an appointment
        run: node scripts/verify-appointment-documents.mjs

      - name: What the board and the queue show
        run: node scripts/verify-schedule-metrics.mjs

      - name: How a report reading is drawn
        run: node scripts/verify-report-readings.mjs

      - name: No em dashes in anything the site renders
        run: node scripts/verify-no-em-dashes.mjs

      - name: Where a combined load came from
        run: node scripts/verify-combine-trail.mjs

      - name: Reading a settings section against editing one
        run: node scripts/verify-edit-mode.mjs

  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render every page and audit its layout
        # Catches clipped fields, dead space in form rows, undersized hit targets,
        # unequal KPI cards and inconsistent spacing before a person has to notice.
        env:
          AUDIT_STRICT: '1'
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/audit-layout.mjs

  # Its own job, not three more steps under the layout audit. A label wrapping onto a
  # second line would fail that audit and *skip* these, so a functional regression in
  # combining, importing or role access could sit behind a spacing fault and never be
  # reported. Two different questions deserve two answers on every push.
  flows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install a browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Walk combining from a board block to the load leaving both boards
        # Combining existed on both sides and had never once been carried through:
        # no appointment in the database had ever been merged, because the only way
        # in was a line in the operations brief. This drives the whole path.
        if: '!cancelled()'
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        run: node scripts/verify-combine-end-to-end.mjs

      - name: Import a sheet of loads from Data integration
        # A spreadsheet of next week is how a site actually arrives on MaxDock, and
        # the import must never become a second way to create an appointment.
        if: '!cancelled()'
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        run: node scripts/verify-import-end-to-end.mjs

      - name: Arrange a role's access and read it back off the rail
        # Taking a link off a rail must never be able to become a lock, and a System
        # Admin must never be able to lose Settings.
        if: '!cancelled()'
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        run: node scripts/verify-rail-end-to-end.mjs
