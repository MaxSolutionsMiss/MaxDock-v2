name: Verify MaxDock Conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Claude architecture checker
        id: claude
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-maxdock.mjs 2>&1 | tee claude-verifier.log

      - name: Run implementation architecture gate
        id: implementation
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-maxdock-implementation.mjs 2>&1 | tee implementation-verifier.log

      - name: Test both verifiers against clean and bad fixtures
        id: fixtures
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/test-verifiers.mjs 2>&1 | tee verifier-fixtures.log

      - name: Report verifier failure on pull request
        if: always() && github.event_name == 'pull_request' && (steps.claude.outcome == 'failure' || steps.implementation.outcome == 'failure' || steps.fixtures.outcome == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (path) => fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '(no output)';
            const body = [
              '## MaxDock conformance diagnostic',
              '',
              '### Claude checker',
              '```text',
              read('claude-verifier.log').slice(0, 18000),
              '```',
              '',
              '### Implementation gate',
              '```text',
              read('implementation-verifier.log').slice(0, 18000),
              '```',
              '',
              '### Fixture tests',
              '```text',
              read('verifier-fixtures.log').slice(0, 18000),
              '```'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Fail when any verifier fails
        if: steps.claude.outcome == 'failure' || steps.implementation.outcome == 'failure' || steps.fixtures.outcome == 'failure'
        run: exit 1
