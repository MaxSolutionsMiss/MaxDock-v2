name: Apply field width discipline

on:
  push:
    branches:
      - feat/stage3-booking
    paths:
      - .github/workflows/apply-field-discipline.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage3-booking
          fetch-depth: 0

      - name: Apply field width and rail rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          css_path = Path('assets/maxdock.css')
          css = css_path.read_text()
          css = replace_once(
              css,
              '.field { display: grid; gap: 6px; }',
              '.field { width: 100%; display: grid; gap: 6px; }',
              'field width contract',
          )
          css = replace_once(
              css,
              '.fieldFlow > .field { flex: 1 1 auto; margin-top: 0; }\n.fieldGrid { display: grid; gap: var(--s3) var(--s4); align-items: start; }',
              '.fieldFlow > .field { flex: 1 1 auto; margin-top: 0; }\n.fieldFlow > .field--full { flex-basis: 100%; }\n.field + .fieldFlow { margin-top: var(--s4); }\n.fieldFlow + .fieldFlow { margin-top: var(--s3); }\n.fieldFlow + .field, .fieldFlow + .check-row { margin-top: var(--s4); }\n.fieldGrid { display: grid; gap: var(--s3) var(--s4); align-items: start; }',
              'field flow spacing',
          )
          css = replace_once(
              css,
              '.fieldGrid--4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }\n.passwordField',
              '.fieldGrid--4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }\n.fieldGrid > .field--full { grid-column: 1 / -1; }\n.passwordField',
              'full field grid span',
          )
          css = replace_once(
              css,
              '.rail__link { display: flex; align-items: center; gap: var(--s3); min-height: var(--tap); margin: 1px var(--s1); padding: 7px var(--s3); border-radius: var(--radius); color: var(--rail-ink); text-decoration: none; transition: background-color var(--motion), color var(--motion); }',
              '.rail__link { display: flex; align-items: center; gap: var(--s3); min-height: var(--tap); margin: 1px var(--s1); padding: 7px var(--s3); border-radius: var(--radius); color: var(--rail-ink); text-decoration: none; white-space: nowrap; transition: background-color var(--motion), color var(--motion); }\n.rail__link span, .rail__link > *:not(svg):not(.rail__count) { overflow: hidden; text-overflow: ellipsis; }',
              'rail nowrap',
          )
          css_path.write_text(css)

          booking_path = Path('js/pages/booking.js')
          booking = booking_path.read_text()
          booking = replace_once(
              booking,
              '<div class="field">\n        <span class="field__label">Direction</span>',
              '<div class="field field--full">\n        <span class="field__label">Direction</span>',
              'direction modifier',
          )
          booking = replace_once(
              booking,
              '<div class="field">\n        <span class="field__label">Movement</span>',
              '<div class="field field--full">\n        <span class="field__label">Movement</span>',
              'movement modifier',
          )
          booking = replace_once(
              booking,
              '<div class="fieldGrid fieldGrid--2">\n      ${!customer && state.form.movement_kind === \'external\' ?',
              '<div class="fieldFlow">\n      ${!customer && state.form.movement_kind === \'external\' ?',
              'load field flow',
          )
          booking = replace_once(
              booking,
              'class="field field--full"><span class="field__label">Other Max Solutions location</span>',
              'class="field field--md"><span class="field__label">Other Max Solutions location</span>',
              'Max location cap',
          )
          booking = replace_once(
              booking,
              '      <label class="field field--md"><span class="field__label">Appointment type</span><select class="select" data-field="appointment_type_code"></select></label>\n      <label class="field field--xs"><span class="field__label">Number of skids</span>',
              '      <label class="field field--md"><span class="field__label">Appointment type</span><select class="select" data-field="appointment_type_code"></select></label>\n    </div>\n    <div class="fieldFlow">\n      <label class="field field--xs"><span class="field__label">Number of skids</span>',
              'compact skid and reference row',
          )
          booking = replace_once(
              booking,
              '      ${isStaff() ? \'<label class="check-row field--full"><input type="checkbox" data-field="is_priority"><span><strong>Priority load</strong><small>Apply the location’s configured priority timing rule.</small></span></label>\' : \'\'}\n    </div>`;',
              '    </div>\n    ${isStaff() ? \'<label class="check-row field--full"><input type="checkbox" data-field="is_priority"><span><strong>Priority load</strong><small>Apply the location’s configured priority timing rule.</small></span></label>\' : \'\'}`;',
              'priority row placement',
          )

          vehicle_start = booking.index('function renderVehicleStep()')
          vehicle_end = booking.index('function renderSlotCards()', vehicle_start)
          vehicle = booking[vehicle_start:vehicle_end]
          vehicle = replace_once(
              vehicle,
              '<div class="fieldGrid fieldGrid--2">',
              '<div class="fieldFlow">',
              'vehicle field flow',
          )
          vehicle = replace_once(
              vehicle,
              '      <label class="field field--md"><span class="field__label">Carrier or courier</span><input class="input" data-field="carrier_name" maxlength="120" autocomplete="organization"></label>\n      <label class="field field--full"><span class="field__label">Notes</span><textarea class="input booking-textarea" data-field="notes" maxlength="1000" rows="4"></textarea><span class="field__hint">Add handling instructions only. Do not include passwords or sensitive personal information.</span></label>\n    </div>`;',
              '      <label class="field field--md"><span class="field__label">Carrier or courier</span><input class="input" data-field="carrier_name" maxlength="120" autocomplete="organization"></label>\n    </div>\n    <label class="field field--full"><span class="field__label">Notes</span><textarea class="input booking-textarea" data-field="notes" maxlength="1000" rows="4"></textarea><span class="field__hint">Add handling instructions only. Do not include passwords or sensitive personal information.</span></label>`;',
              'full notes row',
          )
          booking = booking[:vehicle_start] + vehicle + booking[vehicle_end:]

          time_start = booking.index('function renderTimeStep()')
          time_end = booking.index('function renderContactStep()', time_start)
          time_block = booking[time_start:time_end]
          time_block = replace_once(
              time_block,
              '<div class="fieldGrid fieldGrid--3">',
              '<div class="fieldFlow">',
              'time field flow',
          )
          booking = booking[:time_start] + time_block + booking[time_end:]

          booking = replace_once(
              booking,
              '${state.form.movement_kind === \'external\' ? \'<label class="field field--full"><span class="field__label">Company or organisation</span>',
              '${state.form.movement_kind === \'external\' ? \'<label class="field field--md"><span class="field__label">Company or organisation</span>',
              'contact company cap',
          )
          booking_path.write_text(booking)

          index_path = Path('index.html')
          index = index_path.read_text()
          if index.count('<div class="field">') != 5:
              raise SystemExit('login field audit did not find five uncapped fields')
          index_path.write_text(index.replace('<div class="field">', '<div class="field field--lg">'))

          router_path = Path('js/router.js')
          router = router_path.read_text()
          if router.count('<div class="field">') != 2:
              raise SystemExit('session modal field audit did not find two uncapped fields')
          router_path.write_text(router.replace('<div class="field">', '<div class="field field--lg">'))

          modifiers = {'field--xs', 'field--sm', 'field--md', 'field--lg', 'field--full'}
          plain = []
          counts = {modifier: 0 for modifier in modifiers}
          for path in (booking_path, index_path, router_path):
              text = path.read_text()
              for match in re.finditer(r'class="([^"]*\bfield\b[^"]*)"', text):
                  classes = set(match.group(1).split())
                  if 'field' not in classes:
                      continue
                  for modifier in modifiers:
                      counts[modifier] += modifier in classes
                  if not classes.intersection(modifiers):
                      plain.append(f'{path}:{text.count(chr(10), 0, match.start()) + 1}')
          if plain:
              raise SystemExit(f'uncapped field wrappers remain: {plain}')
          if counts['field--xs'] < 1 or counts['field--sm'] < 5 or counts['field--md'] < 10 or counts['field--lg'] < 8 or counts['field--full'] < 3:
              raise SystemExit(f'field modifier audit failed: {counts}')
          if 'grid-template-columns' in booking_path.read_text():
              raise SystemExit('ad-hoc grid-template-columns remains in booking markup')
          if '!important' in css_path.read_text():
              raise SystemExit('important rule introduced')
          if 'white-space: nowrap' not in css_path.read_text().split('.rail__link:hover', 1)[0].split('.rail__link', 1)[1]:
              raise SystemExit('rail nowrap rule missing')
          PY

      - name: Verify source
        run: |
          node --check js/pages/booking.js
          node --check js/router.js
          node scripts/verify-maxdock.mjs
          node scripts/verify-maxdock-implementation.mjs
          node scripts/verify-stage3-booking.mjs
          git diff --check

      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          git config user.name "MaxDock Field Discipline"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-field-discipline.yml
          git add assets/maxdock.css js/pages/booking.js index.html js/router.js
          git commit -m "Apply field width discipline to rendered forms"
          git push origin HEAD:feat/stage3-booking
