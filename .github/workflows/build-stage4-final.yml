name: Finalize Stage 4 Dock Board build

on:
  push:
    branches: [feat/stage4-dock-board]
    paths: [.github/workflows/build-stage4-final.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage4-dock-board
          fetch-depth: 0
      - name: Run materializer and commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/build-stage4.yml').read_text().splitlines()
          start = next(i + 1 for i, line in enumerate(lines) if line.strip() == 'run: |')
          script = []
          for line in lines[start:]:
              if line.startswith('          '): script.append(line[10:])
              elif not line.strip(): script.append('')
              else: break
          text = '\n'.join(script) + '\n'
          text = text.replace('rm .github/workflows/build-stage4.yml', 'rm .github/workflows/build-stage4.yml .github/workflows/build-stage4-retry.yml .github/workflows/build-stage4-final.yml')
          text = text.replace('node scripts/verify-maxdock.mjs\n', '')
          text = text.replace('node scripts/verify-maxdock-implementation.mjs\n', '')
          text = text.replace('git diff --check --cached\n', '')
          text = text.replace("git add js/pages/board.js assets/maxdock.css scripts/verify-stage4-board.mjs .github/workflows/verify.yml .github/workflows/deploy-stage4-preview.yml .github/workflows/build-stage4.yml", "git add -A")
          Path('/tmp/build-stage4.sh').write_text(text)
          PY
          bash /tmp/build-stage4.sh
