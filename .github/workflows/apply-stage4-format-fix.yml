name: Apply Stage 4 format fix
on:
  push:
    branches: [feat/stage4-dock-board]
    paths: [.github/workflows/apply-stage4-format-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage4-dock-board
      - name: Apply correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          bp=Path('js/pages/board.js')
          b=bp.read_text()
          b=b.replace("import { renderState } from '../ui/empty.js';\n", "import { renderState } from '../ui/empty.js';\nimport { format } from '../format.js';\n")
          start=b.index("const isoDate = value => {")
          end=b.index("const escapeHtml", start)
          b=b[:start]+b[end:]
          b=b.replace("  date: new Date(),", "  date: format.todayInput(),")
          b=b.replace("  const day = state.date.getDay();", "  const day = format.dayOfWeek(state.date);")
          b=b.replace("  const selectedDate = isoDate(state.date);", "  const selectedDate = state.date;")
          b=b.replace("      return isoDate(new Date(record.start_at)) === selectedDate;", "      return format.sameLocalDate(record.start_at, selectedDate, state.context.location);")
          b=b.replace("  const parse = value => { const [h, m] = value.split(':').map(Number); return h * 60 + m; };\n  const start = parse(open);\n  const end = parse(close);", "  const start = format.clockMinutes(open);\n  const end = format.clockMinutes(close);")
          b=b.replace("  const timezone = state.context.location.timezone || 'America/Toronto';\n", "")
          b=b.replace("    const parts = new Intl.DateTimeFormat('en-CA', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: timezone }).formatToParts(new Date(record.start_at));\n    const hour = Number(parts.find(part => part.type === 'hour')?.value || 0);\n    const min = Number(parts.find(part => part.type === 'minute')?.value || 0);\n    const startMinute = hour * 60 + min;\n    const duration = Math.max(1, (new Date(record.end_at) - new Date(record.start_at)) / 60000);", "    const startMinute = format.localTimeMinutes(record.start_at, state.context.location);\n    const duration = Math.max(1, format.minutesBetween(record.start_at, record.end_at));")
          b=b.replace("timeLabel(record.start_at, state.context.location)", "format.time(record.start_at, state.context.location)")
          b=b.replace("timeLabel(record.end_at, state.context.location)", "format.time(record.end_at, state.context.location)")
          b=b.replace("dateLabel(state.date, state.context.location)", "format.longDateInput(state.date, state.context.location)")
          b=b.replace("isoDate(state.date)", "state.date")
          b=b.replace("`Updated ${new Intl.DateTimeFormat('en-CA', { hour: 'numeric', minute: '2-digit', second: '2-digit' }).format(new Date())}`", "`Updated ${format.currentTimeLabel()}`")
          b=b.replace("`Up to date · ${new Intl.DateTimeFormat('en-CA', { hour: 'numeric', minute: '2-digit', second: '2-digit' }).format(new Date())}`", "`Up to date · ${format.currentTimeLabel()}`")
          b=b.replace("state.date = addDays(state.date, Number(day.dataset.day))", "state.date = format.addDaysInput(state.date, Number(day.dataset.day), state.context.location)")
          b=b.replace("state.date = new Date();", "state.date = format.todayInput(state.context.location);")
          b=b.replace("state.date = new Date(`${event.target.value}T12:00:00`);", "state.date = event.target.value;")
          bp.write_text(b)

          fp=Path('js/format.js')
          f=fp.read_text()
          needle="  addDaysInput(value, days, location) {\n    const date = makeDate(value);\n    date.setUTCDate(date.getUTCDate() + Number(days || 0));\n    return this.inputDate(date, location);\n  },\n"
          insert=needle+"\n  todayInput(location) {\n    return this.inputDate(new Date(), location);\n  },\n\n  dayOfWeek(dateInput) {\n    const [year, month, day] = String(dateInput || '').split('-').map(Number);\n    return new Date(Date.UTC(year, Math.max(0, (month || 1) - 1), day || 1, 12)).getUTCDay();\n  },\n\n  clockMinutes(value) {\n    const [hour, minute] = String(value || '00:00').split(':').map(Number);\n    return Number(hour || 0) * 60 + Number(minute || 0);\n  },\n\n  localTimeMinutes(value, location) {\n    return this.clockMinutes(this.inputTime(value, location));\n  },\n\n  minutesBetween(start, end) {\n    return Math.max(0, (this.epoch(end) - this.epoch(start)) / 60000);\n  },\n\n  longDateInput(dateInput, location) {\n    return new Intl.DateTimeFormat('en-CA', {\n      weekday: 'long', month: 'long', day: 'numeric', year: 'numeric',\n      timeZone: location?.timezone || DEFAULT_TIMEZONE,\n    }).format(makeDate(`${dateInput}T12:00:00Z`));\n  },\n\n  currentTimeLabel() {\n    return new Intl.DateTimeFormat('en-CA', {\n      hour: 'numeric', minute: '2-digit', second: '2-digit',\n    }).format(new Date());\n  },\n"
          if needle not in f: raise SystemExit('format insertion point missing')
          fp.write_text(f.replace(needle,insert))
          PY
          node --check js/pages/board.js
          node --check js/format.js
          git config user.name "MaxDock Stage Builder"
          git config user.email "actions@users.noreply.github.com"
          git add js/pages/board.js js/format.js
          git commit -m "Move Stage 4 date arithmetic into format helpers"
          git push origin HEAD:feat/stage4-dock-board
