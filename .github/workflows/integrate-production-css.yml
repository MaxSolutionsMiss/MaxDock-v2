name: Integrate production CSS components

on:
  push:
    branches:
      - feat/stage4-dock-board
    paths:
      - .github/workflows/integrate-production-css.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage4-dock-board
          fetch-depth: 0
      - name: Integrate application component sections
        shell: bash
        run: |
          git show 9474552308e60c952b30cd8f3dcc07c61e89595e:assets/maxdock.css > /tmp/pre-pass.css
          python - <<'PY'
          from pathlib import Path
          canonical = Path('assets/maxdock.css').read_text().rstrip() + '\n\n'
          previous = Path('/tmp/pre-pass.css').read_text()
          marker = '/* Stage 2 — My Appointments */'
          if marker not in previous:
              raise SystemExit('Stage application component marker missing')
          components = previous[previous.index(marker):]
          required = ['.appointment-card', '.choice-card', '.board--operational', '.board-fullscreen']
          missing = [selector for selector in required if selector not in components]
          if missing:
              raise SystemExit(f'Missing application component rules: {missing}')
          Path('assets/maxdock.css').write_text(canonical + components)
          PY
      - name: Verify canonical stylesheet
        shell: bash
        run: |
          node scripts/verify-maxdock.mjs
          node scripts/verify-maxdock-implementation.mjs
          node scripts/verify-stage4-board.mjs
          for selector in board__grid board__door board__time board__cell slot--in slot--out slot--pri slot--blk kpis kpi__value kpi--ok board--operational board-fullscreen; do
            grep -q ".${selector}" assets/maxdock.css
          done
          if grep -v '^\s*\*' assets/maxdock.css | grep -q '!important'; then exit 1; fi
      - name: Commit integrated stylesheet
        shell: bash
        run: |
          git config user.name "MaxDock CSS Integration"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/integrate-production-css.yml
          git add assets/maxdock.css
          git commit -m "Integrate approved production CSS with application components"
          git push origin HEAD:feat/stage4-dock-board
