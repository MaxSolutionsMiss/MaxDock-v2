name: Align booking modal verifier

on:
  push:
    branches:
      - feat/stage4-dock-board
    paths:
      - .github/workflows/align-booking-modal-verifier.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage4-dock-board
          fetch-depth: 0
      - name: Align Stage 3 verifier
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-stage3-booking.mjs')
          text = path.read_text()
          text = text.replace("requireText(css, /\\/\\* Stage 3 — Booking \\*\\//, 'Stage 3 booking styles are missing from the canonical stylesheet.');", "requireText(css, /\\.modal/.test(css) ? /\\.steps/ : /$a/, 'Approved booking modal styles are missing from the canonical stylesheet.');")
          text = text.replace("requireText(router, /code:\\s*'book'/, 'Booking route is missing from the shell.');", "requireText(router, /data-open-booking|maxdock:open-booking/, 'Booking modal action is missing from the shell.');")
          path.write_text(text)
          PY
          node --check scripts/verify-stage3-booking.mjs
      - name: Commit verifier alignment
        shell: bash
        run: |
          git config user.name "MaxDock Approved Handoff"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/align-booking-modal-verifier.yml
          git add scripts/verify-stage3-booking.mjs
          git commit -m "Validate approved booking modal architecture"
          git push origin HEAD:feat/stage4-dock-board
