name: Commit Stage 4 time correction
on:
  push:
    branches: [feat/stage4-dock-board]
    paths: [.github/workflows/fix-stage4-time-source.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage4-dock-board
          fetch-depth: 0
      - name: Apply correction source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/fix-stage4-time.yml').read_text().splitlines()
          start = next(i + 1 for i, line in enumerate(lines) if line.strip() == 'run: |')
          script = []
          for line in lines[start:]:
              if line.startswith('          '): script.append(line[10:])
              elif not line.strip(): script.append('')
              else: break
          text = '\n'.join(script) + '\n'
          text = text.split('node --check js/pages/board.js', 1)[0]
          Path('/tmp/fix-stage4-time.sh').write_text(text)
          PY
          bash /tmp/fix-stage4-time.sh
          node --check js/pages/board.js
      - name: Commit correction
        run: |
          git config user.name "MaxDock Stage Builder"
          git config user.email "actions@users.noreply.github.com"
          git add js/format.js js/pages/board.js
          git commit -m "Move Stage 4 date handling into format module"
          git push origin HEAD:feat/stage4-dock-board
