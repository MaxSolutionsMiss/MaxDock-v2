name: Commit Stage 4 source only

on:
  push:
    branches: [feat/stage4-dock-board]
    paths: [.github/workflows/build-stage4-source-only.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage4-dock-board
          fetch-depth: 0
      - name: Generate application source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/build-stage4.yml').read_text().splitlines()
          start = next(i + 1 for i, line in enumerate(lines) if line.strip() == 'run: |')
          script = []
          for line in lines[start:]:
              if line.startswith('          '): script.append(line[10:])
              elif not line.strip(): script.append('')
              else: break
          text = '\n'.join(script) + '\n'
          text = text.split("cat > .github/workflows/deploy-stage4-preview.yml", 1)[0]
          Path('/tmp/generate-stage4-source.sh').write_text(text)
          PY
          bash /tmp/generate-stage4-source.sh
          node --check js/pages/board.js
          node scripts/verify-stage4-board.mjs
      - name: Commit source files
        shell: bash
        run: |
          git config user.name "MaxDock Stage Builder"
          git config user.email "actions@users.noreply.github.com"
          git add js/pages/board.js assets/maxdock.css scripts/verify-stage4-board.mjs
          git commit -m "Build Stage 4 operational Dock Board"
          git push origin HEAD:feat/stage4-dock-board
