name: Correct Stage 4 time architecture
on:
  push:
    branches: [feat/stage4-dock-board]
    paths: [.github/workflows/fix-stage4-time.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage4-dock-board
          fetch-depth: 0
      - name: Move date arithmetic to format.js
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/format.js')
          t = p.read_text()
          needle = "  nowEpoch() {\n    return Date.now();\n  },\n"
          addition = """  nowEpoch() {
    return Date.now();
  },

  todayInput(location) {
    return this.inputDate(null, location);
  },

  dateFromInput(value) {
    return makeDate(`${value}T12:00:00`);
  },

  minuteOfDay(value, location) {
    const [hour, minute] = this.inputTime(value, location).split(':').map(Number);
    return hour * 60 + minute;
  },

  durationMinutes(start, end) {
    return Math.max(1, (this.epoch(end) - this.epoch(start)) / 60000);
  },

  clockWithSeconds(value, location) {
    return new Intl.DateTimeFormat('en-CA', {
      hour: 'numeric', minute: '2-digit', second: '2-digit',
      timeZone: location?.timezone || DEFAULT_TIMEZONE,
    }).format(makeDate(value));
  },
"""
          if needle not in t: raise SystemExit('format insertion point missing')
          p.write_text(t.replace(needle, addition, 1))

          p = Path('js/pages/board.js')
          t = p.read_text()
          t = t.replace("import { db } from '../db.js';", "import { db } from '../db.js';\nimport { format } from '../format.js';")
          t = t.replace("date: new Date(),", "date: '',")
          start = t.index("const isoDate = value =>")
          end = t.index("const escapeHtml =", start)
          t = t[:start] + "const isoDate = value => format.inputDate(value, state.context?.location);\nconst timeLabel = value => format.time(value, state.context.location);\nconst dateLabel = value => format.date(format.dateFromInput(value), state.context.location);\n" + t[end:]
          t = t.replace("const selectedDate = isoDate(state.date);", "const selectedDate = state.date;")
          t = t.replace("return isoDate(new Date(record.start_at)) === selectedDate;", "return format.sameLocalDate(record.start_at, selectedDate, state.context.location);")
          t = t.replace("dateLabel(state.date, state.context.location)", "dateLabel(state.date)")
          t = t.replace("timeLabel(record.start_at, state.context.location)", "timeLabel(record.start_at)")
          t = t.replace("timeLabel(record.end_at, state.context.location)", "timeLabel(record.end_at)")
          old = """const timezone = state.context.location.timezone || 'America/Toronto';
    return visibleRecords().filter(record => {
      if (record.dock_id !== dockId || !record.start_at || !record.end_at) return false;
      const parts = new Intl.DateTimeFormat('en-CA', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: timezone }).formatToParts(new Date(record.start_at));
      const hour = Number(parts.find(part => part.type === 'hour')?.value || 0);
      const min = Number(parts.find(part => part.type === 'minute')?.value || 0);
      const startMinute = hour * 60 + min;
      const duration = Math.max(1, (new Date(record.end_at) - new Date(record.start_at)) / 60000);"""
          new = """return visibleRecords().filter(record => {
      if (record.dock_id !== dockId || !record.start_at || !record.end_at) return false;
      const startMinute = format.minuteOfDay(record.start_at, state.context.location);
      const duration = format.durationMinutes(record.start_at, record.end_at);"""
          if old not in t: raise SystemExit('cell time block missing')
          t = t.replace(old, new, 1)
          t = t.replace("new Intl.DateTimeFormat('en-CA', { hour: 'numeric', minute: '2-digit', second: '2-digit' }).format(new Date())", "format.clockWithSeconds(null, state.context.location)")
          t = t.replace("state.date = addDays(state.date, Number(day.dataset.day));", "state.date = format.addDaysInput(format.dateFromInput(state.date), Number(day.dataset.day), state.context.location);")
          t = t.replace("state.date = new Date();", "state.date = format.todayInput(state.context.location);")
          t = t.replace("state.date = new Date(`${event.target.value}T12:00:00`);", "state.date = event.target.value;")
          t = t.replace("isoDate(state.date)", "state.date")
          p.write_text(t)
          PY
          node --check js/pages/board.js
          node scripts/verify-maxdock.mjs
          node scripts/verify-maxdock-implementation.mjs
          node scripts/verify-stage4-board.mjs
      - name: Commit correction
        run: |
          git config user.name "MaxDock Stage Builder"
          git config user.email "actions@users.noreply.github.com"
          git add js/format.js js/pages/board.js
          git commit -m "Move Stage 4 date handling into format module"
          git push origin HEAD:feat/stage4-dock-board
