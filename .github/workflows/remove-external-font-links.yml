name: Remove external font links
on:
  push:
    branches: [feat/stage4-dock-board]
    paths: [.github/workflows/remove-external-font-links.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage4-dock-board
      - name: Remove external links
        shell: python
        run: |
          from pathlib import Path
          for code in ['queue','settings','reports','users','data']:
            p = Path(f'app/{code}.html')
            lines = p.read_text().splitlines()
            lines = [line for line in lines if 'fonts.googleapis.com' not in line and 'fonts.gstatic.com' not in line]
            p.write_text('\n'.join(lines) + '\n')
      - name: Commit
        run: |
          git config user.name 'MaxDock Stage Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add app/queue.html app/settings.html app/reports.html app/users.html app/data.html
          git commit -m 'Remove external font dependencies from composed pages'
          git push
