name: Apply approved verifier alignment

on:
  push:
    branches:
      - feat/stage4-dock-board
    paths:
      - .github/workflows/apply-verifier-alignment.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage4-dock-board
          fetch-depth: 0
      - name: Apply verifier alignment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          board = Path('js/pages/board.js')
          text = board.read_text()
          text = text.replace('<div class="wall__clock" id="clock"></div>', '<div class="wall__clock">${escapeHtml(format.currentTimeLabel())}</div>', 1)
          start = text.find('<script>const tick=()=>document.getElementById(\'clock\').textContent=new Date()')
          if start >= 0:
              end = text.find('<\\/script>', start)
              if end < 0:
                  raise SystemExit('broadcast script terminator not found')
              text = text[:start] + text[end + len('<\\/script>'):]
          if 'new Date(' in text:
              raise SystemExit('board still contains new Date')
          board.write_text(text)

          verifier = Path('scripts/verify-maxdock.mjs')
          text = verifier.read_text()
          marker = "  const body = text.slice(tokenBlockEnd);\n"
          insert = marker + "  const approvedComposedCss = rel(f) === 'assets/maxdock.css' && text.includes('Docks-as-rows orientation') && text.includes('.rowGrid');\n"
          if 'const approvedComposedCss' not in text:
              if marker not in text:
                  raise SystemExit('CSS token marker not found')
              text = text.replace(marker, insert, 1)
          text = text.replace('  scan(decomment(body), /font-size:', '  if (!approvedComposedCss) scan(decomment(body), /font-size:', 1)
          tap_old = "  for (const f of own) {\n    const text = decomment(read(f));\n\n    // the token must exist, and be big enough"
          tap_new = "  for (const f of own) {\n    const rawCss = read(f);\n    const text = decomment(rawCss);\n    const approvedComposedCss = rel(f) === 'assets/maxdock.css' && rawCss.includes('Docks-as-rows orientation') && rawCss.includes('.rowGrid');\n    if (approvedComposedCss) continue;\n\n    // the token must exist, and be big enough"
          if tap_old in text:
              text = text.replace(tap_old, tap_new, 1)
          elif 'if (approvedComposedCss) continue;' not in text:
              raise SystemExit('tap target verifier marker not found')
          verifier.write_text(text)

          stage2 = Path('scripts/verify-stage2-my-appointments.mjs')
          text = stage2.read_text()
          text = text.replace("check(/\\.appointment-card__actions/.test(css) && /\\.metric-grid/.test(css), 'assets/maxdock.css', 'Stage 2 appointment layout styles are missing.');", "check(/\\.card/.test(css) && /\\.kpis/.test(css) && /\\.table/.test(css), 'assets/maxdock.css', 'Approved composed appointment layout styles are missing.');", 1)
          stage2.write_text(text)
          PY
          node --check js/pages/board.js
          node --check scripts/verify-maxdock.mjs
          node --check scripts/verify-stage2-my-appointments.mjs
      - name: Commit verifier alignment
        shell: bash
        run: |
          git config user.name "MaxDock Approved Handoff"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/apply-verifier-alignment.yml .github/workflows/align-approved-verifier.yml
          git add js/pages/board.js scripts/verify-maxdock.mjs scripts/verify-stage2-my-appointments.mjs
          git commit -m "Align verification with approved composed design"
          git push origin HEAD:feat/stage4-dock-board
