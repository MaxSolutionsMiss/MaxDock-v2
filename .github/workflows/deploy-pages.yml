name: Validate and Deploy MaxDock v2

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify design conformance
        run: node scripts/verify-maxdock.mjs
      - name: Verify implementation architecture
        run: node scripts/verify-maxdock-implementation.mjs
      - name: Test conformance checkers
        run: node scripts/test-verifiers.mjs
      - name: Verify Stage 1 shell files
        run: node scripts/verify-stage1-shell.mjs
      - name: Verify Stage 2 My Appointments
        run: node scripts/verify-stage2-my-appointments.mjs
      - name: Verify Stage 3 Booking
        run: node scripts/verify-stage3-booking.mjs
      - name: Verify bulk user import
        run: node scripts/verify-users-import.mjs
      - name: Prepare static site artifact
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp -R app assets js _site/
          # The same cache stamp the preview build uses. Without it a deploy changes
          # no URL, so a browser keeps serving the stylesheet and the page modules it
          # already has and a plain reload shows the previous release. Applied to the
          # copied tree only — the source keeps clean paths — and the import
          # specifiers are stamped too, because versioning only the <script> tag
          # would leave every module it imports cached.
          v="$(git rev-parse --short=12 HEAD)"
          # Only our own relative paths — never the Supabase CDN tag.
          find _site -name '*.html' -print0 \
            | xargs -0 sed -i -E "s#(href=\"(\.\./)?assets/maxdock\.css)\"#\1?v=$v\"#g; s#(src=\"(\.\./)?js/[^\"]*\.js)\"#\1?v=$v\"#g"
          find _site/js -name '*.js' -print0 \
            | xargs -0 sed -i -E "s#(from '\.\.?/[^']+\.js)'#\1?v=$v'#g; s#(import\('\.\.?/[^']+\.js)'#\1?v=$v'#g"
          if grep -rq 'supabase.min.js?v=' _site; then
            echo "Cache-busting must not touch the Supabase CDN tag." >&2
            exit 1
          fi
          if grep -rqE "from '\.\.?/[^']+\.js'" _site/js; then
            echo "Cache-busting missed an import specifier:" >&2
            grep -rnE "from '\.\.?/[^']+\.js'" _site/js >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
