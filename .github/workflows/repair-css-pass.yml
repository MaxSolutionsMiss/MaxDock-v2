name: Repair CSS pass source transfer

on:
  push:
    branches:
      - feat/stage4-dock-board
    paths:
      - .github/workflows/repair-css-pass.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage4-dock-board
          fetch-depth: 0

      - name: Restore and apply scoped markup changes
        shell: bash
        run: |
          git show 9474552308e60c952b30cd8f3dcc07c61e89595e:js/pages/booking.js > js/pages/booking.js
          git show 9474552308e60c952b30cd8f3dcc07c61e89595e:js/pages/my-appointments.js > js/pages/my-appointments.js
          git show 9474552308e60c952b30cd8f3dcc07c61e89595e:docs/STATUS.md > docs/STATUS.md
          python - <<'PY'
          from pathlib import Path

          booking = Path('js/pages/booking.js').read_text()
          booking = booking.replace(
              'class="field field--full">\n        <span class="field__label">Direction</span>',
              'class="field field--md">\n        <span class="field__label">Direction</span>',
              1,
          )
          booking = booking.replace(
              'class="field field--full">\n        <span class="field__label">Movement</span>',
              'class="field field--md">\n        <span class="field__label">Movement</span>',
              1,
          )
          Path('js/pages/booking.js').write_text(booking)

          appointments = Path('js/pages/my-appointments.js').read_text()
          replacements = {
              "const card = createElement('div', 'metric-card');": "const card = createElement('div', 'kpi kpi--ok');",
              "const value = createElement('strong', 'metric-card__value data', '0');": "const value = createElement('strong', 'kpi__value data', '0');",
              "const caption = createElement('span', 'metric-card__label', label);": "const caption = createElement('span', 'kpi__label', label);",
              "const metrics = createElement('section', 'metric-grid');": "const metrics = createElement('section', 'kpis');",
          }
          for old, new in replacements.items():
              if old not in appointments:
                  raise SystemExit(f'missing My Appointments marker: {old}')
              appointments = appointments.replace(old, new, 1)
          Path('js/pages/my-appointments.js').write_text(appointments)

          status = Path('docs/STATUS.md').read_text()
          note = '''\n## Stage 4 CSS correction\n\n- Replaced `assets/maxdock.css` with the supplied `maxdock-production.css` extracted from the approved design file.\n- Confirmed the production stylesheet includes `board__grid`, `board__door`, `board__time`, `board__cell`, `slot--in`, `slot--out`, `slot--pri`, `slot--blk`, `kpis`, `kpi__value` and `kpi--ok`.\n- My Appointments now uses the shared `.kpis` / `.kpi` component rather than separate metric-card classes.\n- Booking Direction and Movement wrappers use `.field--md`; Number of skids remains `.field--xs` and PO / BOL / job number remains `.field--sm`.\n- Rail width scales from 196 px to 214 px and 236 px with text size, and rail links remain one line.\n- This pass changes no features and keeps PR #11 draft and unmerged.\n\n'''
          status = status.replace('## Stage 4 acceptance gates', note + '## Stage 4 acceptance gates', 1)
          Path('docs/STATUS.md').write_text(status)
          PY

      - name: Verify repaired source
        shell: bash
        run: |
          test "$(cat js/pages/booking.js)" != "__USE_LOCAL_FILE__"
          test "$(cat js/pages/my-appointments.js)" != "__USE_LOCAL_FILE__"
          test "$(cat docs/STATUS.md)" != "__USE_LOCAL_FILE__"
          node --check js/pages/booking.js
          node --check js/pages/my-appointments.js
          node scripts/verify-maxdock.mjs
          node scripts/verify-maxdock-implementation.mjs
          node scripts/verify-stage4-board.mjs
          grep -q '.board__grid' assets/maxdock.css
          grep -q '.kpi--ok' assets/maxdock.css
          grep -q 'field field--xs' js/pages/booking.js
          grep -q 'field field--sm' js/pages/booking.js
          grep -q 'field field--md' js/pages/booking.js

      - name: Commit repaired pass
        shell: bash
        run: |
          git config user.name "MaxDock CSS Repair"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/repair-css-pass.yml
          git add js/pages/booking.js js/pages/my-appointments.js docs/STATUS.md assets/maxdock.css
          git commit -m "Repair Stage 4 CSS pass source transfer"
          git push origin HEAD:feat/stage4-dock-board
