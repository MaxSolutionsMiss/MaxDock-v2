name: Materialize Stage 3 Source

on:
  push:
    branches:
      - feat/stage3-booking
    paths:
      - '.github/stage3-payload.part-*'
      - '.github/workflows/materialize-stage3.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage3-booking
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify transport commit
        run: node scripts/verify-maxdock.mjs
      - name: Materialize reviewed Stage 3 source
        shell: bash
        run: |
          set -euo pipefail
          cat .github/stage3-payload.part-* | base64 --decode > /tmp/stage3-payload.tar.gz
          tar -xzf /tmp/stage3-payload.tar.gz
          rm -f .github/stage3-payload.part-* .github/workflows/materialize-stage3.yml
          node scripts/verify-maxdock.mjs
          node scripts/verify-maxdock-implementation.mjs
          node scripts/test-verifiers.mjs
          node scripts/verify-stage1-shell.mjs
          node scripts/verify-stage2-my-appointments.mjs
          node scripts/verify-stage3-booking.mjs
      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MaxDock Stage Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Build Stage 3 booking flow'
          git push origin HEAD:feat/stage3-booking
