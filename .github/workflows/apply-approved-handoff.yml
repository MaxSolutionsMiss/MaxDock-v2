name: Apply approved design handoff

on:
  push:
    branches: [feat/stage4-dock-board]
    paths: [.github/workflows/apply-approved-handoff.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage4-dock-board
          fetch-depth: 0
      - name: Decode approved handoff files
        shell: bash
        run: |
          printf '%s' '[... truncated for brevity ...]' | base64 -d > handoff_payload.tgz
          echo 'c0751e476fe41fad97e8dac300d521cece709496e32e864dc4d9d5a308770f2e  handoff_payload.tgz' | sha256sum -c -
          tar -xzf handoff_payload.tgz
          rm handoff_payload.tgz
      - name: Source checks
        run: |
          node --check js/router.js
          node --check js/pages/board.js
          node --check scripts/verify-stage4-board.mjs
          node scripts/verify-stage4-board.mjs
          git diff --check
      - name: Commit approved handoff alignment
        shell: bash
        run: |
          git config user.name "MaxDock Design Handoff"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-approved-handoff.yml
          git add assets/maxdock.css js/router.js js/pages/board.js scripts/verify-stage4-board.mjs docs/STATUS.md
          git commit -m "Align Stage 4 with approved design handoff"
          git push origin HEAD:feat/stage4-dock-board