name: Restore complete approved CSS
on:
  push:
    paths:
      - .github/workflows/restore-complete-approved-css.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore complete baseline and exact handoff components
        shell: bash
        run: |
          git show a907444f8676ca7f55552404a2e2b0412817d1d2:assets/maxdock.css > assets/maxdock.css
          cat >> assets/maxdock.css <<'CSS'

          /* Operations queue components — approved page-3-queue.html */
          .brief{background:linear-gradient(180deg,var(--dock-wash),var(--surface));border:1px solid var(--dock);border-radius:var(--radius-lg);padding:var(--s3) var(--s4);margin-bottom:var(--s3);display:flex;gap:var(--s3);align-items:flex-start}
          .brief__ico{width:32px;height:32px;border-radius:8px;background:var(--dock);color:#fff;display:grid;place-items:center;flex:none;font-weight:700;font-size:14px}
          .brief__body{flex:1}
          .brief__t{font-weight:600;margin-bottom:2px}
          .brief__x{color:var(--ink);font-size:var(--t-base)}
          .brief__x b{color:var(--dock-deep)}
          .split{display:grid;grid-template-columns:1fr 300px;gap:var(--s3);flex:1;min-height:0}
          .heat{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius-lg);padding:var(--s3) var(--s4);display:flex;flex-direction:column}
          .heat__t{font-size:var(--t-base);font-weight:600;margin:0 0 var(--s2);display:flex;align-items:center}
          .heat__t .btn{margin-left:auto}
          .heatgrid{display:grid;grid-template-columns:44px repeat(10,1fr);gap:2px}
          .heatgrid .hh{font-family:var(--font-data);font-size:9px;color:var(--ink-faint);text-align:center}
          .heatgrid .hd{font-family:var(--font-data);font-size:10px;color:var(--ink-muted);display:flex;align-items:center}
          .hc{height:20px;border-radius:2px;background:var(--dock);opacity:calc(var(--v)/5)}
          .watch{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius-lg);padding:var(--s3) var(--s4);overflow:auto}
          .watch__t{font-size:var(--t-base);font-weight:600;margin:0 0 var(--s3)}
          .watchitem{display:flex;gap:var(--s2);padding:var(--s2) 0;border-bottom:1px solid var(--rule);font-size:var(--t-small)}
          .watchitem:last-child{border:none}
          .watchitem b{display:block}
          .wdot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:4px;background:var(--c)}

          /* Capacity components — approved page-5-settings.html */
          .cap{display:flex;flex-direction:column;gap:var(--s2)}
          .capbar{height:26px;border-radius:4px;background:var(--surface-sunk);position:relative;overflow:hidden;display:flex}
          .capbar__in{background:var(--dock);height:100%}
          .capbar__out{background:var(--ok);height:100%}
          .caplegend{display:flex;gap:var(--s4);font-size:var(--t-small);color:var(--ink-muted)}
          .caplegend span{display:inline-flex;align-items:center;gap:5px}
          .caplegend i{width:9px;height:9px;border-radius:2px;display:inline-block}
          .setrow{display:grid;grid-template-columns:1fr auto;gap:var(--s3);align-items:center;padding:8px 0;border-bottom:1px solid var(--rule)}
          .setrow:last-child{border:none}
          .setrow__t{font-size:var(--t-base);font-weight:500}
          .setrow__d{font-size:var(--t-small);color:var(--ink-muted)}
          CSS
          test "$(grep -c '\.brief' assets/maxdock.css)" -gt 0
          test "$(grep -c '\.capbar' assets/maxdock.css)" -gt 0
          test "$(grep -c '\.passwordReveal' assets/maxdock.css)" -gt 0
          ! grep -q '!important' assets/maxdock.css
      - name: Commit
        run: |
          git config user.name 'MaxDock Stage Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/maxdock.css
          git commit -m 'Restore complete approved stylesheet components'
          git push
