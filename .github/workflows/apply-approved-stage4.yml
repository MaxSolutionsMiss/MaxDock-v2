name: Apply approved Stage 4 handoff

on:
  push:
    branches:
      - feat/stage4-dock-board
    paths:
      - .github/workflows/apply-approved-stage4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage4-dock-board
          fetch-depth: 0
      - name: Reconstruct approved bundle
        shell: bash
        run: |
          cat .handoff-approved/chunk-* > /tmp/stage4-approved.b64
          echo "b5b2a583747aaa19bb72b6ebfd06404d45d78a510a85bcda568701983065de7e  /tmp/stage4-approved.b64" | sha256sum -c -
          base64 -d /tmp/stage4-approved.b64 > /tmp/stage4-approved.tgz
          echo "a02a2b123806a6994040314cdf618c8950e1072f0e998d5284c2f372d4dff187  /tmp/stage4-approved.tgz" | sha256sum -c -
          mkdir -p /tmp/stage4-approved
          tar -xzf /tmp/stage4-approved.tgz -C /tmp/stage4-approved
          cp /tmp/stage4-approved/maxdock.css assets/maxdock.css
          cp /tmp/stage4-approved/board.js js/pages/board.js
          cp /tmp/stage4-approved/router.js js/router.js
          cp /tmp/stage4-approved/verify-stage4-board.mjs scripts/verify-stage4-board.mjs
          node --check js/pages/board.js
          node --check js/router.js
          node --check scripts/verify-stage4-board.mjs
          test "$(grep -o '!important' assets/maxdock.css | wc -l)" -eq 0
      - name: Commit approved handoff
        shell: bash
        run: |
          git config user.name "MaxDock Approved Handoff"
          git config user.email "actions@users.noreply.github.com"
          git rm -r .handoff-approved .github/workflows/apply-approved-stage4.yml
          git add assets/maxdock.css js/pages/board.js js/router.js scripts/verify-stage4-board.mjs
          git commit -m "Align Stage 4 with approved design handoff"
          git push origin HEAD:feat/stage4-dock-board
