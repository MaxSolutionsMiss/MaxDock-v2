name: Restore CSS pass sources

on:
  push:
    branches:
      - feat/stage4-dock-board
    paths:
      - .github/workflows/repair-css-pass-source.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage4-dock-board
          fetch-depth: 0
      - name: Restore source and apply scoped markup
        shell: bash
        run: |
          git show 9474552308e60c952b30cd8f3dcc07c61e89595e:js/pages/booking.js > js/pages/booking.js
          git show 9474552308e60c952b30cd8f3dcc07c61e89595e:js/pages/my-appointments.js > js/pages/my-appointments.js
          git show 9474552308e60c952b30cd8f3dcc07c61e89595e:docs/STATUS.md > docs/STATUS.md
          python - <<'PY'
          from pathlib import Path
          p = Path('js/pages/booking.js')
          s = p.read_text()
          s = s.replace('class="field field--full">\n        <span class="field__label">Direction</span>', 'class="field field--md">\n        <span class="field__label">Direction</span>', 1)
          s = s.replace('class="field field--full">\n        <span class="field__label">Movement</span>', 'class="field field--md">\n        <span class="field__label">Movement</span>', 1)
          p.write_text(s)
          p = Path('js/pages/my-appointments.js')
          s = p.read_text()
          for old, new in [
            ("const card = createElement('div', 'metric-card');", "const card = createElement('div', 'kpi kpi--ok');"),
            ("const value = createElement('strong', 'metric-card__value data', '0');", "const value = createElement('strong', 'kpi__value data', '0');"),
            ("const caption = createElement('span', 'metric-card__label', label);", "const caption = createElement('span', 'kpi__label', label);"),
            ("const metrics = createElement('section', 'metric-grid');", "const metrics = createElement('section', 'kpis');"),
          ]:
            if old not in s: raise SystemExit(old)
            s = s.replace(old, new, 1)
          p.write_text(s)
          p = Path('docs/STATUS.md')
          s = p.read_text()
          note = '\n## Stage 4 CSS correction\n\n- Replaced `assets/maxdock.css` with the supplied production stylesheet from the approved design file.\n- Confirmed the board grid, slot, KPI, rail-width and field-cap rules are present.\n- My Appointments uses the shared KPI component.\n- Booking Direction and Movement use `.field--md`; skids use `.field--xs`; PO / BOL / job number uses `.field--sm`.\n- PR #11 remains draft and unmerged.\n\n'
          s = s.replace('## Stage 4 acceptance gates', note + '## Stage 4 acceptance gates', 1)
          p.write_text(s)
          PY
      - name: Commit restored source
        shell: bash
        run: |
          git config user.name "MaxDock CSS Repair"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/repair-css-pass.yml .github/workflows/repair-css-pass-source.yml
          git add js/pages/booking.js js/pages/my-appointments.js docs/STATUS.md assets/maxdock.css
          git commit -m "Restore Stage 4 CSS pass sources"
          git push origin HEAD:feat/stage4-dock-board
